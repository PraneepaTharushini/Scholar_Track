<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scholar Track – Notifications & Reminders</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f8;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      flex-shrink: 0;
      background: linear-gradient(160deg, #1a1a3e 0%, #2d2d5f 100%);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13.5px;
      cursor: pointer;
      transition: all .2s;
      margin-bottom: 4px;
      text-decoration: none;
    }

    .nav-item:hover {
      background: rgba(99, 102, 241, 0.15);
      color: #fff;
    }

    .nav-item.active {
      background: #6366f1;
      color: #fff;
    }

    .nav-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
    }

    .sidebar-version {
      margin-top: auto;
      color: rgba(255, 255, 255, 0.3);
      font-size: 11px;
      padding: 0 6px;
    }

    /* Main */
    .main {
      margin-left: 220px;
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: #fff;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a3e;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .notif-bell {
      position: relative;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 99px;
      min-width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a3e;
    }

    .user-role {
      font-size: 11px;
      color: #9ca3af;
    }

    /* Content */
    .content {
      padding: 28px;
      flex: 1;
    }

    /* Summary bar */
    .summary-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .sum-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
    }

    .sum-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .sum-icon.red {
      background: #fef2f2;
    }

    .sum-icon.amber {
      background: #fffbeb;
    }

    .sum-icon.indigo {
      background: #eef2ff;
    }

    .sum-icon.green {
      background: #f0fdf4;
    }

    .sum-num {
      font-size: 24px;
      font-weight: 800;
      color: #1a1a3e;
      line-height: 1;
    }

    .sum-label {
      font-size: 12px;
      color: #6b7280;
      margin-top: 2px;
    }

    /* Two-column layout */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    /* Panel */
    .panel {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      border-bottom: 1px solid #f3f4f6;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a3e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group {
      display: flex;
      gap: 6px;
    }

    .filter-pill {
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid #e5e7eb;
      background: #fff;
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      cursor: pointer;
      transition: all .2s;
    }

    .filter-pill.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }

    .filter-pill:hover:not(.active) {
      border-color: #6366f1;
      color: #6366f1;
    }

    .mark-all {
      font-size: 12px;
      color: #6366f1;
      cursor: pointer;
      font-weight: 500;
      background: none;
      border: none;
    }

    .mark-all:hover {
      text-decoration: underline;
    }

    /* Notification item */
    .notif-list {
      padding: 8px 0;
      max-height: 520px;
      overflow-y: auto;
    }

    .notif-list::-webkit-scrollbar {
      width: 4px;
    }

    .notif-list::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 4px;
    }

    .notif-item {
      display: flex;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid #f9fafb;
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }

    .notif-item:hover {
      background: #fafafa;
    }

    .notif-item.unread {
      background: #f5f7ff;
    }

    .notif-item.unread:hover {
      background: #eef1ff;
    }

    .unread-dot {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6366f1;
    }

    .notif-ico {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .notif-ico.urgent {
      background: #fef2f2;
    }

    .notif-ico.reminder {
      background: #fffbeb;
    }

    .notif-ico.success {
      background: #f0fdf4;
    }

    .notif-ico.ai {
      background: #f5f3ff;
    }

    .notif-ico.info {
      background: #eff6ff;
    }

    .notif-body {
      flex: 1;
      min-width: 0;
    }

    .notif-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .notif-ttl {
      font-size: 13.5px;
      font-weight: 600;
      color: #111827;
      flex: 1;
    }

    .notif-time {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .notif-msg {
      font-size: 12.5px;
      color: #6b7280;
      margin-top: 3px;
      line-height: 1.5;
    }

    .notif-tags {
      display: flex;
      gap: 6px;
      margin-top: 7px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .tag.urgent {
      background: #fee2e2;
      color: #b91c1c;
    }

    .tag.reminder {
      background: #fef3c7;
      color: #92400e;
    }

    .tag.success {
      background: #d1fae5;
      color: #065f46;
    }

    .tag.ai {
      background: #ede9fe;
      color: #5b21b6;
    }

    .tag.info {
      background: #dbeafe;
      color: #1e40af;
    }

    .notif-action {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-sm {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all .2s;
    }

    .btn-sm.primary {
      background: #6366f1;
      color: #fff;
    }

    .btn-sm.primary:hover {
      background: #4f46e5;
    }

    .btn-sm.ghost {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-sm.ghost:hover {
      background: #e5e7eb;
    }

    .dismiss-btn {
      background: none;
      border: none;
      color: #d1d5db;
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      flex-shrink: 0;
      transition: color .2s;
    }

    .dismiss-btn:hover {
      color: #6b7280;
    }

    /* Right panel - Reminder Settings */
    .settings-list {
      padding: 8px 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #f3f4f6;
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-info {
      flex: 1;
    }

    .setting-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a3e;
    }

    .setting-desc {
      font-size: 11.5px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .toggle {
      width: 44px;
      height: 24px;
      border-radius: 12px;
      background: #d1d5db;
      cursor: pointer;
      position: relative;
      transition: background .25s;
      flex-shrink: 0;
      border: none;
      outline: none;
    }

    .toggle.on {
      background: #6366f1;
    }

    .toggle::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left .25s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
    }

    .toggle.on::after {
      left: 23px;
    }

    /* Schedule section */
    .schedule-card {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px;
      padding: 20px;
      margin: 16px;
      color: #fff;
    }

    .schedule-card h4 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .schedule-card p {
      font-size: 12px;
      opacity: .85;
      line-height: 1.6;
    }

    .schedule-times {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 14px;
    }

    .schedule-time-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, .15);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
    }

    /* Upcoming deadlines */
    .deadline-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid #f3f4f6;
    }

    .deadline-item:last-child {
      border-bottom: none;
    }

    .deadline-bar {
      width: 4px;
      height: 36px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .deadline-info {
      flex: 1;
    }

    .deadline-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a3e;
    }

    .deadline-sub {
      font-size: 11.5px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .deadline-time {
      font-size: 12px;
      font-weight: 700;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: #9ca3af;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty-txt {
      font-size: 14px;
      font-weight: 500;
    }

    @media (max-width: 1000px) {
      .two-col {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 60px;
      }

      .main {
        margin-left: 60px;
      }

      .logo-text,
      .nav-item span:not(.nav-icon) {
        display: none;
      }

      .summary-bar {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const navItems = [
      { icon: '📊', label: 'Dashboard', href: 'index.html' },
      { icon: '⬆️', label: 'Upload Documents', href: 'index.html' },
      { icon: '✅', label: 'Review Tasks', href: 'index.html' },
      { icon: '📝', label: 'Tasks', href: 'index.html' },
      { icon: '📅', label: 'Calendar', href: 'index.html' },
      { icon: '📈', label: 'Analytics', href: 'index.html' },
      { icon: '🔔', label: 'Notifications', href: 'notifications.html', active: true },
      { icon: 'ℹ️', label: 'System Info', href: 'admin.html' },
      { icon: '⚙️', label: 'Settings', href: 'index.html' },
    ];

    function Toggle({ on, onToggle }) {
      return <button className={`toggle${on ? ' on' : ''}`} onClick={onToggle} aria-pressed={on} />;
    }

    function App() {
      const [filter, setFilter] = useState('all');
      const [items, setItems] = useState([]);
      const [settingsList, setSettingsList] = useState([]);
      const [toggles, setToggles] = useState({});
      const [upcoming, setUpcoming] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function fetchData() {
          try {
            const [notifsRes, prefsRes, deadlinesRes] = await Promise.all([
              fetch('http://localhost:3000/api/notifications'),
              fetch('http://localhost:3000/api/reminders/preferences'),
              fetch('http://localhost:3000/api/reminders/deadlines')
            ]);
            const notifs = await notifsRes.json();
            const prefs = await prefsRes.json();
            const deadlines = await deadlinesRes.json();

            setItems(notifs);
            setSettingsList(prefs);

            const togglesMap = {};
            prefs.forEach(s => togglesMap[s.pref_key] = s.is_enabled);
            setToggles(togglesMap);

            setUpcoming(deadlines);
          } catch (e) {
            console.error('Error fetching data:', e);
          } finally {
            setLoading(false);
          }
        }
        fetchData();
      }, []);

      const filtered = filter === 'all' ? items
        : filter === 'unread' ? items.filter(n => n.is_unread)
          : items.filter(n => n.type === filter);

      const unreadCount = items.filter(n => n.is_unread).length;

      const dismiss = async id => {
        setItems(prev => prev.filter(n => n.id !== id));
        await fetch(`http://localhost:3000/api/notifications/${id}`, { method: 'DELETE' });
      };

      const markAll = async () => {
        setItems(prev => prev.map(n => ({ ...n, is_unread: false })));
        await fetch('http://localhost:3000/api/notifications/mark-all-read', { method: 'PATCH' });
      };

      const markRead = async id => {
        setItems(prev => prev.map(n => n.id === id ? { ...n, is_unread: false } : n));
        await fetch(`http://localhost:3000/api/notifications/${id}/read`, { method: 'PATCH' });
      };

      const handleToggle = async (key) => {
        const current = toggles[key];
        setToggles(p => ({ ...p, [key]: !current }));
        await fetch(`http://localhost:3000/api/reminders/preferences/${key}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ is_enabled: !current })
        });
      };

      const counts = {
        urgent: items.filter(n => n.type === 'urgent').length,
        reminder: items.filter(n => n.type === 'reminder').length,
        unread: unreadCount,
        ai: items.filter(n => n.type === 'ai').length,
      };

      if (loading) return <div style={{ padding: 40, textAlign: 'center' }}>Loading...</div>;

      return (
        <>
          {/* Sidebar */}
          <div className="sidebar">
            <div className="logo">
              <div className="logo-icon">✓</div>
              <span className="logo-text">Scholar Track</span>
            </div>
            {navItems.map(n => (
              <a key={n.label} className={`nav-item${n.active ? ' active' : ''}`} href={n.href}>
                <span className="nav-icon">{n.icon}</span>
                <span>{n.label}</span>
              </a>
            ))}
            <div className="sidebar-version">v1.0.0</div>
          </div>

          {/* Main */}
          <div className="main">
            <div className="topbar">
              <div className="topbar-title">🔔 Notifications & Reminders</div>
              <div className="topbar-right">
                <div className="notif-bell">
                  🔔
                  {unreadCount > 0 && <div className="badge">{unreadCount}</div>}
                </div>
                <div>
                  <div className="user-name">Sarah</div>
                  <div className="user-role">Student</div>
                </div>
                <div className="avatar">S</div>
              </div>
            </div>

            <div className="content">
              {/* Summary bar */}
              <div className="summary-bar">
                <div className="sum-card">
                  <div className="sum-icon red">🚨</div>
                  <div><div className="sum-num">{counts.urgent}</div><div className="sum-label">Urgent Alerts</div></div>
                </div>
                <div className="sum-card">
                  <div className="sum-icon amber">⏰</div>
                  <div><div className="sum-num">{counts.reminder}</div><div className="sum-label">Reminders</div></div>
                </div>
                <div className="sum-card">
                  <div className="sum-icon indigo">📬</div>
                  <div><div className="sum-num">{counts.unread}</div><div className="sum-label">Unread</div></div>
                </div>
                <div className="sum-card">
                  <div className="sum-icon green">🤖</div>
                  <div><div className="sum-num">{counts.ai}</div><div className="sum-label">AI Alerts</div></div>
                </div>
              </div>

              <div className="two-col">
                {/* Left: notification feed */}
                <div>
                  <div className="panel">
                    <div className="panel-header">
                      <div className="panel-title">📋 Notification Feed</div>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                        <button className="mark-all" onClick={markAll}>Mark all read</button>
                      </div>
                    </div>
                    <div style={{ padding: '12px 20px 8px', borderBottom: '1px solid #f3f4f6', display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                      {['all', 'unread', 'urgent', 'reminder', 'ai', 'success'].map(f => (
                        <button key={f} className={`filter-pill${filter === f ? ' active' : ''}`} onClick={() => setFilter(f)}>
                          {f.charAt(0).toUpperCase() + f.slice(1)}
                        </button>
                      ))}
                    </div>
                    <div className="notif-list">
                      {filtered.length === 0 ? (
                        <div className="empty">
                          <div className="empty-icon">🎉</div>
                          <div className="empty-txt">All caught up! No notifications here.</div>
                        </div>
                      ) : filtered.map(n => (
                        <div key={n.id} className={`notif-item${n.is_unread ? ' unread' : ''}`} onClick={() => n.is_unread && markRead(n.id)}>
                          {n.is_unread && <div className="unread-dot" />}
                          <div className={`notif-ico ${n.type}`}>{n.icon}</div>
                          <div className="notif-body">
                            <div className="notif-top">
                              <div className="notif-ttl">{n.title}</div>
                              <div className="notif-time">{n.time_label || n.time}</div>
                            </div>
                            <div className="notif-msg">{n.message || n.msg}</div>
                            <div className="notif-tags">
                              {n.tags && n.tags.map(t => <span key={t} className={`tag ${t}`}>{t.toUpperCase()}</span>)}
                              <span style={{ fontSize: 11, color: '#9ca3af', marginLeft: 4 }}>{n.course}</span>
                            </div>
                            <div className="notif-action">
                              <button className="btn-sm primary">View Task</button>
                              <button className="btn-sm ghost" onClick={(e) => { e.stopPropagation(); dismiss(n.id); }}>Dismiss</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Upcoming deadlines panel */}
                  <div className="panel" style={{ marginTop: 20 }}>
                    <div className="panel-header">
                      <div className="panel-title">📅 Upcoming Deadlines</div>
                      <a href="index.html" style={{ fontSize: 12, color: '#6366f1', textDecoration: 'none', fontWeight: 500 }}>View Calendar →</a>
                    </div>
                    {upcoming.map((d, i) => (
                      <div className="deadline-item" key={i}>
                        <div className="deadline-bar" style={{ background: d.color }} />
                        <div className="deadline-info">
                          <div className="deadline-title">{d.title}</div>
                          <div className="deadline-sub">{d.course} · {d.deadline_time || d.time}</div>
                        </div>
                        <div className="deadline-time" style={{ color: d.color }}>{d.urgency_label || d.urgency}</div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Right: settings + schedule */}
                <div>
                  <div className="panel">
                    <div className="panel-header">
                      <div className="panel-title">⚙️ Reminder Preferences</div>
                    </div>
                    <div className="settings-list">
                      {settingsList.map(s => (
                        <div className="setting-row" key={s.id}>
                          <div className="setting-info">
                            <div className="setting-name">{s.label}</div>
                            <div className="setting-desc">{s.description || s.desc}</div>
                          </div>
                          <Toggle on={toggles[s.pref_key]} onToggle={() => handleToggle(s.pref_key)} />
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* AI Study schedule suggestion */}
                  <div className="schedule-card" style={{ marginTop: 20 }}>
                    <h4>🤖 AI Study Schedule for Today</h4>
                    <p>Based on your deadlines and past patterns, here's your optimised study plan:</p>
                    <div className="schedule-times">
                      <div className="schedule-time-row"><span>🕓 4:00 – 6:00 PM</span><span style={{ fontWeight: 600 }}>Database Project</span></div>
                      <div className="schedule-time-row"><span>🕖 6:30 – 8:00 PM</span><span style={{ fontWeight: 600 }}>Algebra Review</span></div>
                      <div className="schedule-time-row"><span>🕗 8:30 – 9:30 PM</span><span style={{ fontWeight: 600 }}>Statistics Read</span></div>
                    </div>
                  </div>

                  {/* Notification channel status */}
                  <div className="panel" style={{ marginTop: 20 }}>
                    <div className="panel-header">
                      <div className="panel-title">📡 Delivery Channels</div>
                    </div>
                    {[
                      { icon: '📧', label: 'Gmail SMTP', status: 'Connected', color: '#10b981' },
                      { icon: '🌐', label: 'Browser Push', status: 'Enabled', color: '#10b981' },
                      { icon: '📱', label: 'PWA Mobile', status: 'Ready', color: '#10b981' },
                    ].map(c => (
                      <div className="setting-row" key={c.label}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ fontSize: 18 }}>{c.icon}</span>
                          <div className="setting-name">{c.label}</div>
                        </div>
                        <span style={{ fontSize: 12, fontWeight: 700, color: c.color }}>● {c.status}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
